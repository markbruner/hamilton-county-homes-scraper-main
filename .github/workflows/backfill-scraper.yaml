name: Backfill Hamilton County Scrape

on:
  schedule:
    # Sundays at 12:25 UTC.
    - cron: "25 12 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare sales records without writing to Supabase
        type: boolean
        default: true
      start_date:
        description: Optional first sale date (YYYY-MM-DD)
        type: string
      end_date:
        description: Optional last sale date (YYYY-MM-DD)
        type: string

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04

    # prevent overlapping runs
    concurrency:
      group: daily-hch-scrape
      cancel-in-progress: false

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check browser and driver
        run: |
          firefox --version
          geckodriver --version

      - name: Dry run backfill scraper
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          range=(--min_days_ago 4 --max_days_ago 5)
          if [[ -n "$START_DATE" || -n "$END_DATE" ]]; then
            range=(--start-date="$START_DATE" --end-date="$END_DATE")
          fi
          python -m hch_scraper.pipelines.daily_scraper --dry-run "${range[@]}"

      - name: Run backfill scraper and load sales
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          range=(--min_days_ago 4 --max_days_ago 184)
          if [[ -n "$START_DATE" || -n "$END_DATE" ]]; then
            range=(--start-date="$START_DATE" --end-date="$END_DATE")
          fi
          python -m hch_scraper.pipelines.daily_scraper "${range[@]}"
