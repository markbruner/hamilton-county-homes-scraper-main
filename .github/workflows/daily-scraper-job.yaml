name: Daily Hamilton County Scrape

on:
  schedule:
    # Daily at 12:25 UTC.
    - cron: "25 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare sales records without writing to Supabase
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04

    # prevent overlapping runs
    concurrency:
      group: daily-hch-scrape
      cancel-in-progress: false

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check browser and driver
        run: |
          firefox --version
          geckodriver --version

      - name: Dry run daily scraper
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m hch_scraper.pipelines.daily_scraper --dry-run --min_days_ago 1 --max_days_ago 3

      - name: Run daily scraper and load sales
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m hch_scraper.pipelines.daily_scraper \
            --min_days_ago 1 \
            --max_days_ago 3
